name: debug-env
on: workflow_dispatch
jobs:
  env:
    runs-on: [self-hosted, camera-rig]
    steps:
      - run: |
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "HOME=$HOME"
          echo "whoami=$(whoami)"
          env | grep -iE 'tool|cache|home' | sort
