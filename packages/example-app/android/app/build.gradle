apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
// This app lives in a Yarn workspace monorepo, so react-native and its
// siblings are hoisted to the workspace root's node_modules, not this app's
// own -- every commented default below in the `react {}` block assumes a
// flat, non-monorepo layout and none of those relative paths exist here.
// Resolved the same Node-module-resolution-aware way android/settings.gradle
// resolves @react-native/gradle-plugin (and the way the RN CLI's own iOS
// Podfile template already resolves react-native/scripts/react_native_pods.rb):
// via `require.resolve`, which walks up parent node_modules directories and
// finds a hoisted package regardless of where Yarn actually placed it.
//
// Captured into a plain local File first, rather than read back through
// `react { reactNativeDir }` (a lazy Gradle DirectoryProperty) inside the
// block below -- reading a DirectoryProperty back via GString interpolation
// stringifies the lazy Property wrapper, not the path it holds, which then
// silently fails RNGP's own `detectCliFile`'s File.exists() check and falls
// through to ITS internal `require.resolve('react-native/cli')` (note: no
// ".js"), which fails with the exact same ERR_PACKAGE_PATH_NOT_EXPORTED
// below -- confirmed empirically by reading RNGP's own PathUtils.kt source
// (vendored at node_modules/@react-native/gradle-plugin) after hitting that
// failure downstream, inside plugin application, with no other clue which
// of the three resolutions had actually gone wrong.
def reactNativeNodeModulesDir = file(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).parentFile

react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    reactNativeDir = reactNativeNodeModulesDir
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    codegenDir = file(["node", "--print", "require.resolve('@react-native/codegen/package.json')"].execute(null, rootDir).text.trim()).parentFile
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    //   `require.resolve('react-native/cli.js')` itself fails here (confirmed
    //   empirically: ERR_PACKAGE_PATH_NOT_EXPORTED) because react-native's own
    //   package.json "exports" map does not expose that subpath externally,
    //   even though the file exists on disk -- an unrelated Node "exports"
    //   encapsulation rule, not a hoisting problem. Built from the plain File
    //   captured above instead, avoiding that resolution entirely.
    cliFile = new File(reactNativeNodeModulesDir, "cli.js")

    /* Hermes Commands */
    //   The same hoisting problem as the three resolutions above, and the one
    //   that keeps a RELEASE build from working at all in this monorepo.
    //   The React Native Gradle Plugin looks for the prebuilt Hermes compiler
    //   at "<react.root>/node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc"
    //   (PathUtils.kt, HERMES_COMPILER_NPM_DIR), and `react.root` defaults to
    //   ../.. -- packages/example-app -- while Yarn hoists `hermes-compiler`
    //   to the workspace root. RNGP finds nothing there and fails the build
    //   with "Couldn't determine Hermesc location", naming a path
    //   (node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc) that this
    //   version of React Native does not even use.
    //
    //   Only release builds hit it: debug variants skip bundling entirely
    //   (react.debuggableVariants), so nothing ever asked for hermesc before
    //   CI needed an installable APK with the JS inside it.
    //
    //   `%OS-BIN%` is left in the string deliberately -- RNGP substitutes it
    //   with osx-bin/linux64-bin/win64-bin itself, so the same line works on
    //   a developer's mac and on an ubuntu runner.
    hermesCommand = new File(
        file(["node", "--print", "require.resolve('hermes-compiler/package.json')"].execute(null, rootDir).text.trim()).parentFile,
        "hermesc/%OS-BIN%/hermesc",
    ).toString()

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.exampleapp"
    defaultConfig {
        applicationId "com.exampleapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Off unless a build asks for it, so an ordinary build of this app is
        // exactly what it was: an example app that shows over the lock screen
        // is not what anyone wants installed on their phone.
        //
        // `scripts/run-fold-test.sh` asks for it. That test drives fold states
        // with `adb shell cmd device_state` and reads what the app reports
        // across the configuration change, and Android defers configuration
        // changes for an activity it has stopped. A device sitting on a desk
        // behind a secure lock screen stops the activity, so the fold reaches
        // nothing and the test reads silence -- which looks exactly like a
        // fold that changed nothing. It was watched doing precisely that
        // before this flag existed: a density change, which this activity does
        // not declare and therefore cannot survive, also produced no
        // recreation while the lock screen was up.
        //
        // A test that cannot be run without someone unlocking the phone is not
        // a test a reviewer can re-run, which is the whole point of scripting
        // it.
        // The set this activity declares it can absorb without being
        // recreated. The default is exactly what the React Native template
        // ships and what this app has always declared, so an ordinary build
        // is unchanged.
        //
        // It is a placeholder so that `scripts/run-fold-test.sh` can build the
        // other case. On a Pixel 10 Pro Fold the default absorbs a fold
        // completely -- both panels report the same density, and every other
        // dimension a fold changes is in the list -- so a fold never recreates
        // the activity and never exercises the unsubscribe and resubscribe
        // path this library's signal channel depends on. That is a true result
        // about this manifest and a misleading one about folding: a product
        // that does not declare these is recreated on every fold, and that
        // product is the one at risk.
        //
        // Building the reduced set is how the fold test observes that case
        // directly, rather than inferring it from a density change that stands
        // in for a fold.
        def defaultConfigChanges =
            "keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
        manifestPlaceholders = [
            showWhenLocked: (project.findProperty("showWhenLocked") ?: "false").toString(),
            activityConfigChanges:
                (project.findProperty("activityConfigChanges") ?: defaultConfigChanges).toString()
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
